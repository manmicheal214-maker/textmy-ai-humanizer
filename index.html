<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BypassAI — Text Humanizer</title>
    <meta
        name="description"
        content="A simple browser-based text rewriting tool."
    >

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-950">
        <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
            <h1 class="text-xl font-bold text-indigo-400">
                ✨ BypassAI
                <span class="text-xs font-normal text-slate-500">v1.0</span>
            </h1>

            <a
                href="https://github.com"
                target="_blank"
                rel="noopener noreferrer"
                class="text-sm text-slate-400 hover:text-white transition"
            >
                View on GitHub
            </a>
        </div>
    </header>

    <!-- Main -->
    <main class="flex-1 w-full max-w-7xl mx-auto p-6">

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

            <!-- Input -->
            <section class="flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <label
                        for="inputText"
                        class="font-medium text-slate-300"
                    >
                        Input Text
                    </label>

                    <span
                        id="inputCount"
                        class="text-xs text-slate-500"
                    >
                        0 characters
                    </span>
                </div>

                <textarea
                    id="inputText"
                    class="w-full min-h-[350px] p-4 bg-slate-900 border border-slate-800 rounded-xl focus:outline-none focus:border-indigo-500 text-slate-300 resize-y"
                    placeholder="Paste your text here..."
                ></textarea>

                <button
                    id="humanizeBtn"
                    class="mt-4 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-xl transition shadow-lg"
                >
                    ✨ Rewrite Text
                </button>
            </section>

            <!-- Output -->
            <section class="flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <label
                        for="outputText"
                        class="font-medium text-slate-300"
                    >
                        Rewritten Text
                    </label>

                    <span
                        id="outputCount"
                        class="text-xs text-slate-500"
                    >
                        0 characters
                    </span>
                </div>

                <textarea
                    id="outputText"
                    readonly
                    class="w-full min-h-[350px] p-4 bg-slate-900 border border-slate-800 rounded-xl text-emerald-400 focus:outline-none resize-y"
                    placeholder="Your rewritten text will appear here..."
                ></textarea>

                <button
                    id="copyBtn"
                    class="mt-4 bg-slate-800 hover:bg-slate-700 text-slate-200 font-medium py-3 px-6 rounded-xl transition"
                >
                    📋 Copy to Clipboard
                </button>
            </section>

        </div>

        <!-- Status -->
        <p
            id="status"
            class="text-center text-sm text-slate-500 mt-6 min-h-[20px]"
            aria-live="polite"
        ></p>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 py-5 text-center text-xs text-slate-500">
        Runs entirely in your browser. No API key required.
    </footer>

    <script src="app.js"></script>
</body>
</html>
